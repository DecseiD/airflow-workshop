# Overlay for Apache Airflow Helm chart: metrics emission for Prometheus scraping

statsd:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Keep this small for workshop; enable ServiceMonitor so kube-prometheus-stack can discover it
serviceMonitor:
  enabled: true

# If chart version supports podMonitor, this remains optional and harmless for unsupported versions
podMonitor:
  enabled: false
