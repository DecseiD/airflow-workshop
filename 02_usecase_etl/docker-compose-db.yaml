version: '3.8'

services:
  iot-db:
    image: postgres:15-alpine
    container_name: iot_telemetry_db
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_telemetry
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - iot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airflow-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  iot-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: iot_api
    ports:
      - "5000:5000"
    depends_on:
      iot-db:
        condition: service_healthy
    networks:
      - airflow-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  airflow-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: airflow_dashboard
    ports:
      - "3001:80"
    depends_on:
      - iot-api
    networks:
      - airflow-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  iot-db-data:

networks:
  airflow-net:
    external: true
